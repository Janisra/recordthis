<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janisra Wongpaiboon — Record This</title>
  
  
  
  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <style>
    @import url('https://fonts.cdnfonts.com/css/monument-extended');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --white: #f5f5f0;
      --off-white: #e0e0da;
      --muted: rgba(245,245,240,0.42);
      --pink: #ff2d55;
    }
    html, body {
      min-height: 100vh;
      background: var(--black);
      font-family: "Outfit", sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }
    body { display: flex; flex-direction: column; align-items: center; }

    .vinyl-bg {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130vmax; height: 130vmax;
      pointer-events: none; z-index: 0;
      animation: vinylSpin 45s linear infinite;
      opacity: 0.045;
    }
    @keyframes vinylSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column;
    }

    .header {
      padding: 56px 32px 0;
      display: flex; justify-content: center;
      animation: fadeDown 0.7s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo-wrap { width: 100px; }
    .logo-wrap img { width: 100%; height: auto; display: block; }

    .identity {
      padding: 32px 32px 0;
      text-align: center;
      animation: fadeUp 0.7s 0.15s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .name {
      font-family: "Monument Extended", "Bebas Neue", sans-serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--white); line-height: 1.1;
      margin-bottom: 8px;
    }
    .role {
      font-size: 10.5px; font-weight: 400;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 4px;
    }
    .company-name {
      font-family: "Monument Extended", "Bebas Neue", sans-serif;
      font-size: 13px; letter-spacing: 0.10em;
      color: rgba(245,245,240,0.4);
    }

    .groove-divider {
      display: flex; align-items: center; gap: 10px;
      padding: 26px 32px;
      animation: fadeUp 0.7s 0.22s ease both;
    }
    .groove-line {
      flex: 1; height: 0.5px;
      background: linear-gradient(to right, transparent, rgba(245,245,240,0.13), transparent);
    }
    .groove-dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: rgba(245,245,240,0.2);
    }

    .contact-list {
      padding: 0 24px;
      display: flex; flex-direction: column; gap: 8px;
      animation: fadeUp 0.7s 0.28s ease both;
    }
    .contact-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      text-decoration: none; color: var(--white);
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .contact-item:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.18);
      transform: translateX(3px);
    }
    .contact-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg {
      width: 16px; height: 16px;
      stroke: rgba(245,245,240,0.6); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .contact-text { display: flex; flex-direction: column; gap: 1px; }
    .contact-label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(245,245,240,0.28);
    }
    .contact-value { font-size: 13.5px; font-weight: 400; color: var(--off-white); }

    .contact-item.line-item .contact-icon {
      background: rgba(6,199,85,0.1);
      border-color: rgba(6,199,85,0.2);
    }
    .contact-item.line-item .contact-icon svg { stroke: #06c755; fill: #06c755; }

    .website-section { padding: 8px 24px 0; animation: fadeUp 0.7s 0.36s ease both; }
    .website-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      text-decoration: none; color: var(--off-white); font-size: 13.5px;
      transition: background 0.18s, border-color 0.18s;
    }
    .website-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.18); }
    .website-btn svg {
      width: 14px; height: 14px;
      stroke: rgba(245,245,240,0.3); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .save-section { padding: 10px 24px 0; animation: fadeUp 0.7s 0.42s ease both; }
    .save-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 15px;
      background: var(--white); border: none; border-radius: 14px;
      color: var(--black); font-family: "Outfit", sans-serif;
      font-size: 14px; font-weight: 500; letter-spacing: 0.05em;
      text-decoration: none; cursor: pointer;
      transition: opacity 0.18s, transform 0.15s;
    }
    .save-btn:hover { opacity: 0.88; transform: scale(0.99); }
    .save-btn svg {
      width: 17px; height: 17px;
      stroke: var(--black); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .footer {
      padding: 36px 28px 56px;
      text-align: center;
      animation: fadeUp 0.7s 0.48s ease both;
    }
    .footer-tagline {
      font-size: 10.5px; font-weight: 300;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(245,245,240,0.18); line-height: 1.9;
      display: flex; align-items: center;
      justify-content: center; flex-wrap: wrap; gap: 0 2px;
    }
    .pink-dot {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--pink); margin: 0 6px; flex-shrink: 0;
      animation: blink 2.8s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>
</head>
